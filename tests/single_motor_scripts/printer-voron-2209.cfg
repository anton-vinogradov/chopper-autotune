[printer]
kinematics: corexy
max_velocity: 500
max_accel: 3000

[stepper_x]
step_pin: P100
dir_pin: P101
enable_pin: !P102
microsteps: 16
rotation_distance: 40
endstop_pin: ^P104
position_endstop: 350
position_max: 350

[stepper_y]
step_pin: P105
dir_pin: P106
enable_pin: !P107
microsteps: 16
rotation_distance: 40
endstop_pin: ^P109
position_endstop: 350
position_max: 350

[stepper_z]
step_pin: P110
dir_pin: P111
enable_pin: !P112
microsteps: 16
rotation_distance: 8
endstop_pin: ^P113
position_endstop: 0
position_max: 200

[tmc2209 stepper_x]
driver_TBL: 1
driver_TOFF: 4
driver_HSTRT: 2
driver_HEND: 3
uart_pin: P103
run_current: 0.8
sense_resistor: 0.110

[tmc2209 stepper_y]
driver_TBL: 1
driver_TOFF: 4
driver_HSTRT: 2
driver_HEND: 3
uart_pin: P108
run_current: 0.8
sense_resistor: 0.110

[adxl345]
cs_pin: P114

[resonance_tester]
accel_chip: adxl345
probe_points: 175, 175, 20

[force_move]
enable_force_move: True

[respond]

[display_status]
