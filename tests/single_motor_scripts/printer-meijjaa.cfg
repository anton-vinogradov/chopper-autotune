[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 500
minimum_cruise_ratio: 0.5

[stepper_x]
step_pin: P100
dir_pin: P101
enable_pin: !P102
microsteps: 16
rotation_distance: 40
endstop_pin: tmc5160_stepper_x:virtual_endstop
homing_retract_dist: 0
position_endstop: 0
position_max: 300

[stepper_y]
step_pin: P105
dir_pin: P106
enable_pin: !P107
microsteps: 16
rotation_distance: 40
endstop_pin: tmc5160_stepper_y:virtual_endstop
homing_retract_dist: 0
position_endstop: 0
position_max: 210

[stepper_z]
step_pin: P110
dir_pin: P111
enable_pin: !P112
microsteps: 16
rotation_distance: 8
endstop_pin: ^P113
position_endstop: 0
position_max: 200

[tmc5160 stepper_x]
driver_TBL: 1
driver_TOFF: 4
driver_HSTRT: 2
driver_HEND: 3
cs_pin: P103
run_current: 0.8
sense_resistor: 0.075
diag1_pin: ^!P104
driver_SGT: 1

[tmc5160 stepper_y]
driver_TBL: 1
driver_TOFF: 4
driver_HSTRT: 2
driver_HEND: 3
cs_pin: P108
run_current: 0.8
sense_resistor: 0.075
diag1_pin: ^!P109
driver_SGT: 1

[adxl345]
cs_pin: P114

[resonance_tester]
accel_chip: adxl345
probe_points: 150, 105, 20

[force_move]
enable_force_move: True

[respond]

[display_status]
