# Klipper merges a section that several config files declare, without a word, and
# for each option the file it reads last wins. install.sh includes this file on the
# first line of printer.cfg, so a [force_move] of your own still decides.
[force_move]
enable_force_move: True

# A config file read after this one that defines one of our macro or shell command
# names replaces ours, and the name then runs another tool (#132). This check names
# such macros at every Klipper start: on the display, which keeps the message (M117
# exists where [display_status] is loaded; 'Clash FIND_SPEED' fits a 16-character
# LCD row, a second name past it shows in the Mainsail header), and in the console with
# the whole story, which a frontend still
# starting up after a power-on may miss. Each of our macros calls CMD=<its own name>,
# and each such command runs a script of ours. The check sits in the delayed_gcode
# itself: Klipper prints an error once at every macro level it passes, and from a
# macro the delayed_gcode called, the console got it twice. A template error here
# reaches only klippy.log, so the template reads nothing that may be missing: a
# section of ours removed by hand is skipped, not taken for a conflict.
[delayed_gcode chopper_autotune_selfcheck]
initial_duration: 10
gcode:
    {% set settings = printer.configfile.settings %}
    {% set replaced = [] %}
    {% for name in ['TUNE', 'COLLECT', 'ANALYZE', 'FIND_SPEED', 'STATUS', 'DEMO', 'SAVE', 'RESTORE', 'STOP', 'CURRENT', 'ENVELOPE', 'MAP', 'BELTS', 'EXTRUDER'] %}
        {% set macro = 'chopper_' ~ name|lower %}
        {% set ours = settings.get('gcode_macro ' ~ macro) %}
        {% set shell = settings.get('gcode_shell_command ' ~ macro, {}) %}
        {% if ours and ('CMD=' ~ macro not in ours.get('gcode', '')
                        or 'chopper-autotune/' not in shell.get('command', '')) %}
            {% set _ = replaced.append(macro|upper) %}
        {% endif %}
    {% endfor %}
    {% if replaced %}
        {% if 'display_status' in printer %}
            M117 Clash {replaced|join(',')|replace('CHOPPER_', '')}
        {% endif %}
        _CHOPPER_REPLACED NAMES={replaced|join(',')}
    {% endif %}

[gcode_macro _CHOPPER_REPLACED]
description: The console error of the chopper-autotune self-check
gcode:
    {% set names = params.NAMES.split(',') %}
    {action_raise_error("chopper-autotune: %s %s another tool. A config file read after chopper_autotune.cfg defines the same name, and Klipper keeps the last one. Keep one of the two tools: see 'Macro name conflicts' in the chopper-autotune README." % (names|join(', '), 'runs' if names|length == 1 else 'run'))}

[gcode_shell_command chopper_tune]
command: ~/chopper-autotune/tune.sh
timeout: 86400.0
verbose: True

[gcode_shell_command chopper_collect]
command: ~/chopper-autotune/collect.sh
timeout: 86400.0
verbose: True

[gcode_shell_command chopper_analyze]
command: ~/chopper-autotune/analyze.sh
timeout: 3600.0
verbose: True

[gcode_shell_command chopper_find_speed]
command: ~/chopper-autotune/find_speed.sh
timeout: 7200.0
verbose: True

[gcode_shell_command chopper_status]
command: ~/chopper-autotune/status.sh
timeout: 60.0
verbose: True

[gcode_shell_command chopper_demo]
command: ~/chopper-autotune/demo.sh
timeout: 1200.0
verbose: True

[gcode_shell_command chopper_stop]
command: ~/chopper-autotune/stop.sh
timeout: 30.0
verbose: True

[gcode_shell_command chopper_save]
command: ~/chopper-autotune/save.sh
timeout: 120.0
verbose: True

[gcode_shell_command chopper_restore]
command: ~/chopper-autotune/restore.sh
timeout: 120.0
verbose: True

[gcode_shell_command chopper_current]
command: ~/chopper-autotune/current.sh
timeout: 7200.0
verbose: True

[gcode_shell_command chopper_envelope]
command: ~/chopper-autotune/envelope.sh
timeout: 7200.0
verbose: True

[gcode_shell_command chopper_map]
command: ~/chopper-autotune/map.sh
timeout: 7200.0
verbose: True

[gcode_shell_command chopper_belts]
command: ~/chopper-autotune/belts.sh
timeout: 7200.0
verbose: True

[gcode_shell_command chopper_extruder]
command: ~/chopper-autotune/extruder.sh
timeout: 7200.0
verbose: True

# PARAMS is built from the params Klipper parsed, not {rawparams}: a '; comment' after the
# macro stays in rawparams and reached the tool as arguments. Each value goes single-quoted
# to the shell command's shlex split, its own backslashes and quotes escaped, backslashes
# first: left for later, a backslash before a quote in a value closed PARAMS early.
[gcode_macro CHOPPER_CURRENT]
description: Find the minimal safe run current per motor: worst-case stress + endstop referee ([MOTOR=AB MARGIN=2.0 SAVE=1 DRY_RUN=1])
gcode:
    RUN_SHELL_COMMAND CMD=chopper_current PARAMS="{% for key in params %}{key}='{params[key]|replace('\\', '\\\\')|replace("'", "'\\''")|replace('"', '\\"')}' {% endfor %}"

[gcode_macro CHOPPER_ENVELOPE]
description: Motor torque ceiling — top speed and acceleration before skipped steps, at the configured current ([MOTOR=AB MIN_SPEED=150 MAX_SPEED=350 STEP=50 ACCEL_PROBE_SPEED=150 DRY_RUN=1])
gcode:
    RUN_SHELL_COMMAND CMD=chopper_envelope PARAMS="{% for key in params %}{key}='{params[key]|replace('\\', '\\\\')|replace("'", "'\\''")|replace('"', '\\"')}' {% endfor %}"

[gcode_macro CHOPPER_MAP]
description: Resonance map — vibration vs speed on the current registers, which speeds ring (VFAs) vs stay quiet ([MOTOR=A MIN_SPEED=20 MAX_SPEED=250 STEP=10 PRINT_SPEED=200 DRY_RUN=1])
gcode:
    RUN_SHELL_COMMAND CMD=chopper_map PARAMS="{% for key in params %}{key}='{params[key]|replace('\\', '\\\\')|replace("'", "'\\''")|replace('"', '\\"')}' {% endfor %}"

[gcode_macro CHOPPER_BELTS]
description: Belt tension by guided pluck (default; [SPAN=35 PLUCKS=4]); SWEEP=1 = diagonal response diagnostic; SHOW=A/B jogs a motor
gcode:
    RUN_SHELL_COMMAND CMD=chopper_belts PARAMS="{% for key in params %}{key}='{params[key]|replace('\\', '\\\\')|replace("'", "'\\''")|replace('"', '\\"')}' {% endfor %}"

[gcode_macro CHOPPER_EXTRUDER]
description: Tune the extruder chopper — HEATS the hotend, filament stays loaded ([TEMP=200 SPEED=5 SAVE=1 DRY_RUN=1]); SAVE_LAST=1 persists the last winner without re-tuning; DEMO=1 plays defaults vs tuned
gcode:
    RUN_SHELL_COMMAND CMD=chopper_extruder PARAMS="{% for key in params %}{key}='{params[key]|replace('\\', '\\\\')|replace("'", "'\\''")|replace('"', '\\"')}' {% endfor %}"

[gcode_macro CHOPPER_TUNE]
description: Tune the whole printer in one go: resonance speed + register descent per motor ([MOTOR=AB SAVE=1 SPEED=.. AUDIBLE_KHZ=.. SKIP_AUDIBLE=1 DRY_RUN=1])
gcode:
    RUN_SHELL_COMMAND CMD=chopper_tune PARAMS="{% for key in params %}{key}='{params[key]|replace('\\', '\\\\')|replace("'", "'\\''")|replace('"', '\\"')}' {% endfor %}"

[gcode_macro CHOPPER_COLLECT]
description: Collect a chopper tuning dataset (SPEED=55 [MOTOR=A TBL=0:3 TOFF=1:8 HSTRT=0:7 HEND=0:15 TPFD=.. ITERATIONS=1 MEASURE_TIME=1.25 DRY_RUN=1])
gcode:
    RUN_SHELL_COMMAND CMD=chopper_collect PARAMS="{% for key in params %}{key}='{params[key]|replace('\\', '\\\\')|replace("'", "'\\''")|replace('"', '\\"')}' {% endfor %}"

[gcode_macro CHOPPER_ANALYZE]
description: Rank the latest dataset, write a report, print the recommended config ([DATASET=.. TOP=15 AUDIBLE_KHZ=.. RECOMPUTE=1 APPLY=1])
gcode:
    RUN_SHELL_COMMAND CMD=chopper_analyze PARAMS="{% for key in params %}{key}='{params[key]|replace('\\', '\\\\')|replace("'", "'\\''")|replace('"', '\\"')}' {% endfor %}"

[gcode_macro CHOPPER_FIND_SPEED]
description: Sweep speeds with current registers to locate resonance peaks ([MOTOR=A MIN_SPEED=20 MAX_SPEED=120 STEP=2 ITERATIONS=1 DRY_RUN=1])
gcode:
    RUN_SHELL_COMMAND CMD=chopper_find_speed PARAMS="{% for key in params %}{key}='{params[key]|replace('\\', '\\\\')|replace("'", "'\\''")|replace('"', '\\"')}' {% endfor %}"

[gcode_macro CHOPPER_STATUS]
description: Progress of the most recent (or given DATASET=) collection run
gcode:
    RUN_SHELL_COMMAND CMD=chopper_status PARAMS="{% for key in params %}{key}='{params[key]|replace('\\', '\\\\')|replace("'", "'\\''")|replace('"', '\\"')}' {% endfor %}"

[gcode_macro CHOPPER_DEMO]
description: Audible before/after show — plays defaults vs the tuned registers ([MOTOR=AB both by default, or A/B SPEED=.. ROUNDS=3 REPEATS=4]); REPORT=1 prints the measured numbers instead
gcode:
    RUN_SHELL_COMMAND CMD=chopper_demo PARAMS="{% for key in params %}{key}='{params[key]|replace('\\', '\\\\')|replace("'", "'\\''")|replace('"', '\\"')}' {% endfor %}"

[gcode_macro CHOPPER_SAVE]
description: Save the latest tuning result for each motor into the config (backup first) and restart Klipper
gcode:
    RUN_SHELL_COMMAND CMD=chopper_save PARAMS="{% for key in params %}{key}='{params[key]|replace('\\', '\\\\')|replace("'", "'\\''")|replace('"', '\\"')}' {% endfor %}"

[gcode_macro CHOPPER_RESTORE]
description: Roll back the tool's config changes — DEFAULTS=1 stock chopper registers (current stays), BACKUP=1 the pre-save snapshots (currents too)
gcode:
    RUN_SHELL_COMMAND CMD=chopper_restore PARAMS="{% for key in params %}{key}='{params[key]|replace('\\', '\\\\')|replace("'", "'\\''")|replace('"', '\\"')}' {% endfor %}"

[gcode_macro CHOPPER_STOP]
description: Stop a running chopper-autotune job (it restores registers and re-homes on exit)
gcode:
    RUN_SHELL_COMMAND CMD=chopper_stop
